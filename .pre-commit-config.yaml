repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: trailing-whitespace
          - id: end-of-file-fixer
          - id: check-yaml
          - id: check-json

    - repo: local
      hooks:
          - id: readynode-typescript
            name: ReadyNode TypeScript Check
            entry: npx tsc --noEmit
            language: system
            pass_filenames: false

          - id: readynode-eslint
            name: ReadyNode ESLint Check
            entry: npx eslint --fix
            language: system
            files: \.(js|jsx|ts|tsx)$

          - id: readynode-commit-msg
            name: ReadyNode Commit Message Check
            entry: python hooks/commit-msg/readynode-commit-msg.py
            language: system
            stages: [commit-msg]

          - id: readynode-protect-main
            name: ReadyNode Protect Main Branch Check
            entry: python hooks/pre-commit/readynode-protect-main.py
            language: system
            pass_filenames: false

          - id: readynode-prettier
            name: ReadyNode Prettier Check
            entry: npx prettier --write --ignore-unknown
            language: system
            files: \.(js|jsx|ts|tsx|json|css|scss|md|yaml|yml)$

          - id: readynode-tests
            name: ReadyNode Tests Check
            entry: npm test -- --runInBand --watch=false
            language: system
            pass_filenames: false
            files: \.(js|jsx|ts|tsx|json|css|scss|md|yaml|yml)$

          - id: readynode-git-guardian
            name: ReadyNode GitGuardian Check
            entry: ggshield secret scan pre-commit
            language: system
            pass_filenames: false
